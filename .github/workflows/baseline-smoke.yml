name: Baseline smoke tests

on:
  push:
    branches: [main]
    paths:
      - "baselines/**"
      - ".github/workflows/baseline-smoke.yml"
  pull_request:
    paths:
      - "baselines/**"
      - ".github/workflows/baseline-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pillow

      - name: U-Net smoke test
        run: python baselines/unet/train.py --demo --epochs 1 --batch-size 4 --device cpu

      - name: SegFormer smoke test
        run: python baselines/segformer/train.py --demo --epochs 1 --batch-size 4 --device cpu

      - name: SAM-RS wrapper smoke test
        run: python baselines/sam_rs/predict.py --demo
