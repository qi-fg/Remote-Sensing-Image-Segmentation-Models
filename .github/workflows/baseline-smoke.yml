name: Baseline smoke tests

on:
  push:
    branches: [main]
    paths:
      - "baselines/**"
      - "rsseg/**"
      - "tests/**"
      - "train.py"
      - "evaluate.py"
      - ".github/workflows/baseline-smoke.yml"
  pull_request:
    paths:
      - "baselines/**"
      - "rsseg/**"
      - "tests/**"
      - "train.py"
      - "evaluate.py"
      - ".github/workflows/baseline-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pillow "transformers>=4.46,<5"

      - name: LoveDA adapter tests
        run: python -m unittest tests.test_loveda_adapter

      - name: Unified U-Net smoke test
        run: python train.py --model unet --mode smoke --device cpu --output /tmp/unet-smoke

      - name: Unified SegFormer smoke test
        run: python train.py --model segformer --mode smoke --device cpu --output /tmp/segformer-smoke

      - name: Standard SegFormer-B0 architecture smoke test
        run: |
          python - <<'PY'
          import torch
          from rsseg.models import build_model

          model = build_model("segformer_b0", num_classes=7, pretrained=False)
          x = torch.rand(1, 3, 64, 64)
          y = model(x)
          assert y.shape == (1, 7, 64, 64), y.shape
          print("standard SegFormer-B0 forward OK", tuple(y.shape))
          PY

      - name: SAM-RS wrapper smoke test
        run: python baselines/sam_rs/predict.py --demo
