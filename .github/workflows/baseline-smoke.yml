name: Baseline smoke tests

on:
  push:
    branches: [main]
    paths:
      - "baselines/**"
      - "rsseg/**"
      - "train.py"
      - "evaluate.py"
      - ".github/workflows/baseline-smoke.yml"
  pull_request:
    paths:
      - "baselines/**"
      - "rsseg/**"
      - "train.py"
      - "evaluate.py"
      - ".github/workflows/baseline-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pillow

      - name: Unified U-Net smoke test
        run: python train.py --model unet --mode smoke --device cpu --output /tmp/unet-smoke

      - name: Unified SegFormer smoke test
        run: python train.py --model segformer --mode smoke --device cpu --output /tmp/segformer-smoke

      - name: SAM-RS wrapper smoke test
        run: python baselines/sam_rs/predict.py --demo
